<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="brightside — ติดตามการออกกำลังกายรายวัน คลังท่าออกกำลังกาย และตัวออกแบบโปรแกรมฝึก" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="brightside" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'"
    />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
    <style>
      /* หน้าโหลดแรก: แสดงทันทีระหว่างรอสคริปต์ (React จะแทนที่เมื่อพร้อม) */
      #boot { min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 1rem; background: #f7f8fb; }
      #boot-retry { margin-top: 0.5rem; min-height: 44px; padding: 0 1.25rem; border-radius: 12px; border: 1px solid #e2e6ee; background: #fff; color: #0f172a; font: 500 1rem system-ui, sans-serif; }
      #boot i { width: 32px; height: 32px; border-radius: 50%; border: 3px solid #e3e8f1; border-top-color: #ff7a1a; animation: bs-spin 0.8s linear infinite; }
      @keyframes bs-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot i { animation-duration: 3s; } }
    </style>
    <script>
      // โหลดช้า/ไม่ขึ้นเกิน 8 วินาที: แสดงปุ่มให้ผู้ใช้แตะเพื่อล้างแคชแล้วโหลดใหม่เอง (ไม่รีโหลดอัตโนมัติ เพราะวนลูปได้)
      setTimeout(function () {
        var b = document.getElementById('boot')
        if (!b) return
        b.insertAdjacentHTML('beforeend', '<button id="boot-retry" type="button">โหลดช้าผิดปกติ แตะเพื่อโหลดใหม่</button>')
        document.getElementById('boot-retry').onclick = function () {
          var go = function () { location.reload() }
          var sw = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) }) : Promise.resolve()
          sw.then(function () { return window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k) })) }) : 0 }).then(go, go)
        }
      }, 8000)
    </script>
    <title>brightside - ออกกำลังกาย</title>
  </head>
  <body>
    <div id="root"><div id="boot" role="status" aria-label="กำลังโหลด"><i></i></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
